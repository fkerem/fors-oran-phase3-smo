name: Profile checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: for script in setup-*.sh bin/*.sh; do bash -n "$script" || exit; done
      - run: shellcheck -x -S error setup-driver.sh setup-oran-smo.sh setup-phase3-preflight.sh setup-end.sh bin/phase3-status.sh
